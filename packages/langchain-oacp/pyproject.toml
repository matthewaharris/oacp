[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-oacp"
version = "0.2.1"
description = "LangChain integration for the Open Agent Communication Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Matt Harris", email = "matt@liteneen.net" },
]
keywords = ["langchain", "ai", "agents", "oacp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "oacp-sdk>=0.1.0",
]

[project.urls]
Homepage = "https://liteneen.net"
Repository = "https://github.com/matthewaharris/oacp"
Dashboard = "https://dashboard.liteneen.net"

[tool.hatch.build.targets.wheel]
packages = ["langchain_oacp"]

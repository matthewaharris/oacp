[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oacp-sdk"
version = "0.4.1"
description = "Python client for the Open Agent Communication Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Matt Harris", email = "matt@liteneen.net" },
]
keywords = ["ai", "agents", "oacp", "multi-agent", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pynacl>=1.5.0",
]

[project.urls]
Homepage = "https://liteneen.net"
Documentation = "https://github.com/matthewaharris/oacp/blob/main/docs/getting-started.md"
Repository = "https://github.com/matthewaharris/oacp"
Dashboard = "https://dashboard.liteneen.net"

[tool.hatch.build.targets.wheel]
packages = ["oacp"]
